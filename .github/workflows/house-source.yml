name: Refresh published House source
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: house-source
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'clunkyard/house-sentry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and refresh public source
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/clunkyard/.github/8eadfdd5855c747e45c5c0a5ceea170ec25b3951/scripts/sync-house.cjs' -o "$RUNNER_TEMP/sync-house.cjs"
          printf '%s  %s\n' '59ab6f6dd932aca19498f8bdb061ba2f6542d5c6b5b0ccb3acd9fb3c1090e404' "$RUNNER_TEMP/sync-house.cjs" | sha256sum --check
          node "$RUNNER_TEMP/sync-house.cjs" --sync b419e8e5-02de-468c-b994-7e80e416ee4d --slug sentry
      - name: Commit verified changes
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'clunkyard-house[bot]'
          git config user.email 'house@users.noreply.github.com'
          git commit -m 'Refresh published House robot source'
          git push
